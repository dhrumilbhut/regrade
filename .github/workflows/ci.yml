name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The test run builds the CLI first (vitest global setup); e2e tests spawn dist/cli.js.
      - run: npm test
      - name: Committed JSON Schema is up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code schema/suite.schema.json
