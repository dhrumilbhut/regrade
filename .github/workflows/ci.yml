name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The test run builds the CLI first (vitest global setup); e2e tests spawn dist/cli.js.
      - run: npm test
      - name: Committed JSON Schema is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: git diff --exit-code schema/suite.schema.json
