name: Sample report

# Builds Regrade, runs the deterministic sample (no API keys needed), and publishes the
# generated comparison report as a static GitHub Pages site so the README can link to a
# real, clickable report. Requires Pages to be enabled (Settings -> Pages -> Source: GitHub Actions).
# Runs on every push to main so the published page always matches the code, and can be run by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sample-report
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
